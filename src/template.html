{{@hreflang}}<style>
:root{
  --serif:"Palatino Linotype","Book Antiqua",Palatino,"URW Palladio L",Georgia,"Times New Roman",serif;
  --bg:#03040a; --bg2:#0b1028; --ink:#e7ecff; --ink-dim:#9ba5c9; --ink-faint:#7c86aa;
  --acc:#9cc2ff; --acc-hi:#eef3ff; --acc-lo:#4b5ea8; --line:rgba(156,194,255,.20);
  --card:rgba(10,14,34,.55); --glow:170,200,255;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; font-family:var(--serif); color:var(--ink); background-color:var(--bg);
  line-height:1.55; overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
/* Неподвижные слои фона высотой в «большой» экран (lvh): на телефоне адресная строка при прокрутке
   прячется и появляется, обычная высота окна при этом меняется, а lvh — нет, и фон не дёргается */
body::before,.sky,.neb,#stars{position:fixed; top:0; left:0; width:100%; height:100vh; height:100lvh; pointer-events:none; z-index:0}
body::before{content:""; background:radial-gradient(ellipse 80% 60% at 50% 32%, var(--bg2) 0%, var(--bg) 72%)}
/* ——— Глубокий космос ——— */
.sky{
  overflow:hidden; opacity:0;
  transition:opacity 2.4s ease, transform 2.8s cubic-bezier(.3,0,.2,1);
}
.sky.ready{opacity:1}
.sky canvas{position:absolute; left:-8%; top:-8%; width:116%; height:116%; animation:drift 160s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-1.5%,-1%,0) rotate(-.4deg)} to{transform:translate3d(1.5%,1%,0) rotate(.4deg)}}
body.spinning .sky{transform:scale(1.07)}
.neb{overflow:hidden; opacity:0; transition:opacity 3s ease}
.neb.ready{opacity:1}
/* приглушение космоса, пока читаешь карточку: тёмная вуаль между фоном и содержимым */
body::after{
  content:""; position:fixed; top:0; left:0; width:100%; height:100vh; height:100lvh; pointer-events:none; z-index:0;
  background:rgba(3,4,10,.3); opacity:0; transition:opacity 1.2s ease;
}
body.reading::after{opacity:1}
.neb canvas{position:absolute; inset:0; width:100%; height:100%}
.wrap{position:relative; z-index:1; max-width:780px; margin:0 auto; padding:28px 16px 40px}
button{font-family:inherit; color:inherit}

/* ——— Шапка ——— */
header.top{text-align:center; padding-top:22px; position:relative}
.tools{position:absolute; right:0; top:0; z-index:2; display:flex; gap:10px}
.icon-btn{
  position:relative; width:38px; height:38px; padding:0; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
  background:transparent; border:1px solid var(--line); color:var(--ink-faint); font-size:17px; cursor:pointer;
  transition:border-color .3s, color .3s, box-shadow .3s;
}
.icon-btn svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round}
.icon-btn:hover,.icon-btn[aria-expanded="true"]{border-color:var(--acc); color:var(--acc-hi)}
.icon-btn[aria-pressed="true"]{color:var(--acc-hi); border-color:var(--acc); box-shadow:0 0 12px rgba(var(--glow),.35)}
.icon-btn[aria-pressed="false"]::after{   /* перечёркнутая нота — звук выключен */
  content:""; position:absolute; left:10px; right:10px; top:50%; height:1px; background:currentColor; transform:rotate(-45deg);
}
.logo{
  margin:0; font-weight:400; font-size:clamp(34px,7vw,54px); letter-spacing:.32em; padding-left:.32em;
  font-variant:small-caps; line-height:1.1;
  background:linear-gradient(180deg, var(--acc-hi) 0%, var(--acc) 55%, var(--acc-lo) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 14px rgba(var(--glow),.22));
}
.tagline{margin:6px 0 0; font-style:italic; color:var(--ink-dim); font-size:15px}
.divider{display:flex; align-items:center; justify-content:center; gap:12px; color:var(--acc); font-size:9px; margin:18px auto 0; max-width:340px}
.divider span{flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--acc))}
.divider span:last-child{background:linear-gradient(270deg, transparent, var(--acc))}

/* ——— Барабан ——— */
.stage{position:relative; height:360px; margin:14px 0 0}
/* поток идей: края сцены растворяются в космосе — идеи появляются из пустоты и уходят в неё */
.drum{
  position:absolute; inset:0; overflow:hidden;
  /* края сцены гаснут до полной прозрачности со всех четырёх сторон: две линейные маски пересекаются.
     Радиальная маска шире сцены не гасила боковые края, и обрезка (overflow:hidden) проступала прямоугольником */
  -webkit-mask-image:linear-gradient(to right, transparent, #000 12%, #000 88%, transparent), linear-gradient(to bottom, transparent, #000 20%, #000 80%, transparent);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right, transparent, #000 12%, #000 88%, transparent), linear-gradient(to bottom, transparent, #000 20%, #000 80%, transparent);
  mask-composite:intersect;
}
.item{
  position:absolute; left:50%; top:50%; width:min(76%,620px); transform:translate(-50%,-50%);   /* уже зоны, где гаснет маска */
  display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; will-change:transform, opacity;
}
.c-cat{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--acc); opacity:.75; white-space:nowrap}
.c-title{
  font-size:25px; line-height:1.25; color:var(--ink); transition:color .5s, text-shadow .5s;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.item.chosen .c-title{color:var(--acc-hi); text-shadow:0 0 18px rgba(var(--glow),.6)}
/* дальние и пролетающие идеи размыты: прозрачный текст с мягкой тенью размывает сами буквы.
   CSS-фильтр blur здесь не годится — он размывает прямоугольный слой, и его край проступает линией */
.item.soft .c-title{color:transparent; text-shadow:0 0 6px rgba(231,236,255,.9)}
.item.soft .c-cat{color:transparent; text-shadow:0 0 4px rgba(156,194,255,.85)}
.stream.idle .item:not(.focus){opacity:0 !important; transition:opacity .6s ease}   /* в покое — только идея в центре */
/* маяк до первого броска: мерцающая звезда в точке, откуда прилетит идея */
.beacon{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  pointer-events:none; transition:opacity .5s ease, transform .6s ease;
}
.beacon i{
  position:relative; width:9px; height:9px; border-radius:50%; background:var(--acc-hi);
  box-shadow:0 0 12px 4px rgba(var(--glow),.8), 0 0 40px 14px rgba(var(--glow),.35), 0 0 90px 30px rgba(var(--glow),.12);
  animation:beacon 2.6s ease-in-out infinite;
}
.beacon i::before,.beacon i::after{content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%)}
.beacon i::before{width:96px; height:1px; background:linear-gradient(90deg, transparent, rgba(var(--glow),.75), transparent)}
.beacon i::after{width:1px; height:96px; background:linear-gradient(180deg, transparent, rgba(var(--glow),.75), transparent)}
@keyframes beacon{0%,100%{transform:scale(.85); opacity:.75} 50%{transform:scale(1.15); opacity:1}}
.beacon.gone{opacity:0; transform:scale(.6)}
/* вспышка, когда идея прилетает */
.flare{
  position:absolute; left:50%; top:50%; width:440px; height:440px; margin:-220px 0 0 -220px; border-radius:50%; pointer-events:none; opacity:0;
  background:radial-gradient(circle, rgba(var(--glow),.42) 0%, rgba(var(--glow),.12) 32%, transparent 68%);
}
.flare.pop{animation:flare 1.2s cubic-bezier(.2,.7,.2,1)}
@keyframes flare{from{opacity:.95; transform:scale(.3)} to{opacity:0; transform:scale(1.5)}}
/* анимации поиска: у каждой свой слой внутри сцены, виден только выбранный */
.anim{position:absolute; inset:0}
.anim:not(.on){display:none}
.stage.waiting .anim{visibility:hidden}
/* «Расшифровка сигнала» */
.dec{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center}
.dec .cat{min-height:1.3em; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--acc); opacity:.8}
.dec .ttl{max-width:min(76%,620px); font-size:25px; line-height:1.25}
.dec .ttl .n{color:var(--acc); opacity:.55}
.dec.done .ttl{color:var(--acc-hi); text-shadow:0 0 18px rgba(var(--glow),.6)}
/* «Созвездие» */
.links{position:absolute; inset:0; width:100%; height:100%}
.anim.const{animation:constIn .7s ease}   /* новое созвездие проявляется, а не появляется скачком */
@keyframes constIn{from{opacity:0}}
.st{
  position:absolute; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%; background:#dfe8ff;
  box-shadow:0 0 8px 2px rgba(var(--glow),.5); outline:1px solid transparent; outline-offset:4px;
  transition:transform .25s, box-shadow .25s, width .25s, height .25s, margin .25s, outline-color .4s;
}
.st.hit{transform:scale(2.2); box-shadow:0 0 16px 6px rgba(var(--glow),.85)}
/* выбранная звезда растёт размером, а не transform: scale — увеличение утраивало ошибку округления до пикселя,
   и звезда съезжала из кольца; кольцо — контур самой звезды, поэтому всегда точно вокруг неё */
.st.win{width:18px; height:18px; margin:-9px 0 0 -9px; outline-color:rgba(var(--glow),.9); box-shadow:0 0 22px 9px rgba(var(--glow),.9), 0 0 60px 20px rgba(var(--glow),.3)}
.ptr{
  position:absolute; width:28px; height:28px; margin:-14px 0 0 -14px; border-radius:50%; pointer-events:none;
  border:1px solid rgba(var(--glow),.9); box-shadow:0 0 16px rgba(var(--glow),.6), inset 0 0 10px rgba(var(--glow),.35);
  transition-property:left, top, opacity; transition-timing-function:ease-out;
}
.ptr.off{opacity:0}   /* на остановке подвижное кольцо гаснет — его сменяет кольцо выбранной звезды */
.slbl{position:absolute; transform:translate(-50%, 14px); font-size:12px; color:var(--ink-dim); white-space:nowrap; opacity:0; transition:opacity .2s}
.slbl.on{opacity:.9}
/* название найденной идеи — в «Созвездии» и «Полёте к звезде»; выше нижней зоны, где гаснет маска */
.won{
  position:absolute; left:0; right:0; bottom:23%; padding:0 12%; text-align:center; font-size:23px; line-height:1.25; color:var(--acc-hi);
  text-shadow:0 0 18px rgba(var(--glow),.6); opacity:0; transform:translateY(8px); transition:opacity .6s, transform .6s;
}
.won.show{opacity:1; transform:none}
.won small{display:block; margin-bottom:4px; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--acc); text-shadow:none}
.deep canvas{position:absolute; inset:0; width:100%; height:100%}

/* ——— Кнопка ——— */
.actions{text-align:center; margin-top:8px}
.spin{
  font-size:17px; letter-spacing:.2em; text-transform:uppercase; padding:14px 34px; cursor:pointer;
  background:linear-gradient(180deg, rgba(var(--glow),.10), rgba(var(--glow),.02));
  border:1px solid var(--acc); color:var(--acc-hi); border-radius:2px;
  box-shadow:inset 0 0 0 3px transparent, 0 0 0 rgba(var(--glow),0);
  transition:box-shadow .35s, background .35s, opacity .3s, transform .15s;
}
.spin:hover:not(:disabled){box-shadow:inset 0 0 0 3px rgba(var(--glow),.08), 0 0 26px rgba(var(--glow),.28); background:rgba(var(--glow),.12)}
.spin:active:not(:disabled){transform:translateY(1px)}
.spin:disabled{opacity:.45; cursor:default}
.spin:focus-visible,.icon-btn:focus-visible,.seg button:focus-visible,.chip:focus-visible,.sheet .x:focus-visible,.tab:focus-visible{outline:1px dashed var(--acc-hi); outline-offset:3px}
.hint{margin:10px 0 0; font-size:13px; color:var(--ink-faint); font-style:italic; min-height:1.4em}

/* ——— Карточка идеи ——— */
.card{
  position:relative; margin:30px 0 0; padding:30px 30px 26px; background:var(--card);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.card::before,.card::after{
  content:""; position:absolute; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--acc) 20%, var(--acc-hi) 50%, var(--acc) 80%, transparent);
  box-shadow:0 0 10px rgba(var(--glow),.5);
}
.card::before{top:0} .card::after{bottom:0}
.card.show{animation:unfurl .42s cubic-bezier(.2,.7,.2,1)}
@keyframes unfurl{from{opacity:0; filter:blur(8px); transform:scale(.985)} to{opacity:1; filter:none; transform:none}}
.card .empty{margin:0; text-align:center; color:var(--ink-dim); font-style:italic}
.card .meta{font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--acc)}
.card .meta em{text-transform:none; letter-spacing:.02em; font-size:14px; color:var(--ink-dim)}
.card h2{margin:6px 0 12px; font-weight:400; font-size:clamp(23px,4.4vw,30px); line-height:1.25}
.card p.desc{margin:0 0 16px; font-size:17px}
.tags{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px; padding:0; list-style:none}
.tags li{font-size:13px; padding:3px 11px; border:1px solid var(--line); border-radius:999px; color:var(--ink-dim)}
.tags li b{font-weight:400; color:var(--acc)}
.card h3{margin:18px 0 6px; font-weight:400; font-size:13px; letter-spacing:.24em; text-transform:uppercase; color:var(--acc)}
.card ol{margin:0; padding-left:22px}
.card ol li{margin:3px 0}
.card ol li::marker{color:var(--acc); font-variant-numeric:oldstyle-nums}
.trial{margin:18px 0 0; padding:12px 16px; border-left:2px solid var(--acc); background:rgba(var(--glow),.06); font-style:italic}
.trial b{font-style:normal; font-weight:400; letter-spacing:.18em; text-transform:uppercase; font-size:12px; color:var(--acc); display:block; margin-bottom:2px}
.card-actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:22px}
.card-ask{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:12px}
.card-ask > span{color:var(--ink-dim); font-style:italic; font-size:14px; margin-right:2px}
.ghost{
  font-size:14px; padding:8px 16px; cursor:pointer; background:transparent; border:1px solid var(--line);
  color:var(--ink-dim); border-radius:2px; transition:border-color .25s, color .25s;
}
.ghost:hover{border-color:var(--acc); color:var(--acc-hi)}
a.ghost{display:inline-block; line-height:normal; text-decoration:none}

/* ——— Выдвижные панели: параметры пространства и хроника ——— */
.veil{position:fixed; inset:0; z-index:19; background:rgba(2,3,8,.55); opacity:0; visibility:hidden; transition:opacity .3s, visibility 0s .3s}
.veil.on{opacity:1; visibility:visible; transition:opacity .3s}
.sheet{
  position:fixed; top:0; right:0; z-index:20; width:min(420px,100%); height:100%; overflow-y:auto; padding:18px 22px 30px;
  background:rgba(7,10,24,.94); border-left:1px solid var(--line); box-shadow:-20px 0 60px rgba(0,0,0,.5);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  transform:translateX(100%); visibility:hidden; transition:transform .35s cubic-bezier(.2,.7,.2,1), visibility 0s .35s;
}
.sheet.open{transform:none; visibility:visible; transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.sheet-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px}
.sheet h2{margin:0; font-weight:400; font-size:13px; letter-spacing:.24em; text-transform:uppercase; color:var(--acc)}
.sheet .x{flex:none; width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:transparent; color:var(--ink-dim); font-size:20px; line-height:1; cursor:pointer}
.sheet .x:hover{border-color:var(--acc); color:var(--acc-hi)}
.row.col{flex-direction:column; align-items:flex-start}
.seg.stack{display:flex; flex-direction:column; width:100%}
.seg.stack button{text-align:left; padding:9px 14px}
.seg.stack button + button{border-left:0; border-top:1px solid var(--line)}
.seg.stack small{display:block; margin-top:2px; font-size:12px; font-style:italic; color:var(--ink-faint)}
/* справка */
.help{color:var(--ink-dim); font-size:15px; line-height:1.6}
.help p{margin:0 0 10px}
.help .lead{color:var(--ink); font-size:16px}
.help h3{margin:22px 0 8px; font-weight:400; font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--acc)}
.help ol,.help ul{margin:0 0 10px; padding-left:20px}
.help li{margin:0 0 6px}
.help li::marker{color:var(--acc)}
.help b{font-weight:400; color:var(--ink)}
.help dl{margin:0}
.help dt{color:var(--ink); display:flex; align-items:center; gap:8px}
.help dd{margin:0 0 10px}
.help .icons dd{padding-left:28px}   /* под иконкой кнопки */
.help .ico{flex:none; width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:50%; font-size:11px; color:var(--acc)}
.help .ico svg{width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round}
.help kbd{font:inherit; font-size:13px; padding:0 6px; border:1px solid var(--line); border-radius:3px; color:var(--ink)}
.help .fine{font-size:13px; font-style:italic; color:var(--ink-faint)}
.row{display:flex; align-items:center; flex-wrap:wrap; gap:10px 16px; margin:12px 0}
.lbl{min-width:84px; color:var(--ink-dim); font-style:italic}
.seg{display:inline-flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:2px}
.seg button{background:transparent; border:0; padding:7px 14px; cursor:pointer; color:var(--ink-dim); font-size:14px}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{color:var(--acc-hi); background:rgba(var(--glow),.10)}
.chips{display:flex; flex-wrap:wrap; gap:8px; width:100%}
.chips.off{opacity:.4; pointer-events:none}
.chip{
  font-size:14px; padding:5px 12px; border:1px solid var(--line); border-radius:999px; cursor:pointer; background:transparent; color:var(--ink-faint);
  transition:color .2s, border-color .2s, background .2s;
}
.chip[aria-pressed="true"]{color:var(--ink); border-color:var(--acc); background:rgba(var(--glow),.07)}
.chip span{color:var(--acc); margin-right:6px}
.link{background:none; border:0; padding:0; color:var(--acc); cursor:pointer; font-style:italic; font-size:14px; text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px}
.tabs{display:flex; gap:22px; margin:6px 0 10px}
.tab{background:none; border:0; padding:6px 0; cursor:pointer; font-size:13px; letter-spacing:.24em; text-transform:uppercase; color:var(--ink-faint); border-bottom:1px solid transparent}
.tab[aria-selected="true"]{color:var(--acc); border-bottom-color:var(--acc)}
.list{list-style:none; margin:0; padding:0}
.list li{display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line)}
.list li .open{flex:1; min-width:0; text-align:left; background:none; border:0; padding:9px 0; cursor:pointer; color:var(--ink); font-size:15px; display:flex; gap:10px; align-items:baseline}
.list li .open:hover{color:var(--acc-hi)}
.list .r{color:var(--acc); flex:none}
.list .t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.list .del{background:none; border:0; color:var(--ink-faint); cursor:pointer; font-size:18px; padding:4px 6px}
.list .del:hover{color:var(--acc-hi)}
.list-empty{color:var(--ink-faint); font-style:italic; padding:8px 0; margin:0}
.list-tools{display:flex; gap:16px; margin-top:12px}

/* Письменности без прописных и курсива: китайский, хинди, арабский, фарси, иврит. Курсив браузер подделывает наклоном,
   широкая разрядка растаскивает иероглифы, а в деванагари и арабском письме рвёт лигатуры и связность букв.
   Латиница остаётся антиквой, для своего письма — системные шрифты с засечками; в Windows у китайского нет
   хорошей системной антиквы (SimSun мелким кеглем растровый), поэтому там — Microsoft YaHei */
html:lang(zh){--serif:"Palatino Linotype","Book Antiqua",Palatino,"URW Palladio L",Georgia,"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC","Microsoft YaHei","PingFang SC",serif}
html:lang(zh) body{line-height:1.7}
html:lang(hi){--serif:"Palatino Linotype","Book Antiqua",Palatino,Georgia,"Noto Serif Devanagari","Kokila","Mangal","Nirmala UI",serif}
html:lang(ar),html:lang(fa){--serif:"Palatino Linotype","Book Antiqua",Palatino,Georgia,"Noto Naskh Arabic","Amiri","Traditional Arabic","Times New Roman",serif}
html:lang(he){--serif:"Palatino Linotype","Book Antiqua",Palatino,Georgia,"Noto Serif Hebrew","David","Frank Ruehl CLM","Times New Roman",serif}
:lang(zh) *,:lang(hi) *,:lang(ar) *,:lang(fa) *,:lang(he) *{font-style:normal !important}
:lang(zh) :is(.c-cat,.dec .cat,.won small,.spin,.card .meta,.card h3,.trial b,.sheet h2,.help h3,.tab){letter-spacing:.08em}
:is(:lang(hi),:lang(ar),:lang(fa),:lang(he)) :is(.c-cat,.dec .cat,.won small,.spin,.card .meta,.card h3,.trial b,.sheet h2,.help h3,.tab){letter-spacing:0}
:lang(zh) :is(.c-cat,.dec .cat,.won small){font-size:12px}
.langs{display:flex; flex-wrap:wrap; justify-content:center; gap:6px 14px; margin:14px 0 0; font-size:14px}   /* выбор языка */
.langs a{color:var(--ink-faint); text-decoration:none; padding:2px 0; border-bottom:1px solid transparent}
.langs a:hover{color:var(--acc-hi); border-bottom-color:var(--line)}
.langs a[aria-current="page"]{color:var(--acc)}
footer{margin-top:40px; text-align:center; color:var(--ink-faint); font-size:13px; font-style:italic}
.toast{
  position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); opacity:0; pointer-events:none; z-index:30;
  padding:9px 18px; background:var(--card); border:1px solid var(--acc); color:var(--acc-hi); font-size:14px;
  transition:opacity .3s, transform .3s; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
}
.toast.on{opacity:1; transform:translate(-50%,0)}

@media (max-width:560px){
  .wrap{padding-top:18px}
  .stage{height:300px}
  .c-title{font-size:20px; -webkit-line-clamp:3}
  .c-cat{font-size:10px}
  .card{padding:24px 18px 20px}
  .spin{padding:13px 24px; letter-spacing:.14em}
  .logo{letter-spacing:.2em; padding-left:.2em}
  .lbl{min-width:0; width:100%}
  header.top{padding-top:0}
  .tools{position:static; justify-content:flex-end; margin-bottom:10px}
  .dec .ttl{font-size:20px}
  .won{font-size:19px}
}
@media (prefers-reduced-motion:reduce){
  .card.show{animation-duration:.01s}
  .sky canvas{animation:none}
  .beacon i{animation:none}
  body.spinning .sky{transform:none}
}

<body>
<div class="sky" id="skyWrap" aria-hidden="true"><canvas id="sky"></canvas></div>
<div class="neb" id="neb" aria-hidden="true"></div>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="top">
    <div class="tools">
      <button id="helpBtn" class="icon-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="helpSheet" title="{{help_btn}}" aria-label="{{help_btn}}">?</button>
      <button id="chronBtn" class="icon-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="chronSheet" title="{{chron_btn}}" aria-label="{{chron_btn}}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      </button>
      <button id="setBtn" class="icon-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="setSheet" title="{{set_title}}" aria-label="{{set_title}}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
      <button id="soundBtn" class="icon-btn" type="button" aria-pressed="false" aria-label="{{sound}}">♪</button>
    </div>
    <h1 class="logo">AI_Rulet</h1>
    <p class="tagline">{{tagline}}</p>
    <div class="divider" aria-hidden="true"><span></span>✦<span></span></div>
  </header>

  <main>
    <section class="stage waiting" aria-hidden="true">
      <div class="drum" id="drum"><div class="flare" id="flare"></div></div>
      <div class="beacon" id="beacon"><i></i></div>
    </section>

    <div class="actions">
      <button id="spinBtn" class="spin" type="button" disabled>{{find}}</button>
      <p class="hint" id="hint">{{loading}}</p>
    </div>

    <article id="card" class="card" aria-live="polite">
      <p class="empty">{{card_empty}}</p>
    </article>

  </main>

  <footer id="footer"></footer>
{{@langs}}</div>
<div class="veil" id="veil"></div>
<aside class="sheet" id="setSheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="sheet-head"><h2 id="setTitle">{{set_title}}</h2><button class="x" type="button" aria-label="{{close}}">×</button></div>
  <div class="row col"><span class="lbl">{{anim_label}}</span>
    <div class="seg stack" data-key="anim">
      <button type="button" data-v="stream">{{anim_stream}}</button>
      <button type="button" data-v="decode">{{anim_decode}}</button>
      <button type="button" data-v="const">{{anim_const}}</button>
      <button type="button" data-v="deep">{{anim_deep}}</button>
    </div>
  </div>
  <div class="row col"><span class="lbl">{{source}}</span>
    <div class="seg" data-key="mode">
      <button type="button" data-v="curated">{{src_curated}}</button><button type="button" data-v="mix">{{src_mix}}</button>
    </div>
  </div>
  <div class="row col"><span class="lbl">{{areas}} — <button type="button" class="link" id="allCats">{{all}}</button> · <button type="button" class="link" id="noCats">{{none}}</button></span>
    <div class="chips" id="chips"></div>
  </div>
</aside>
<aside class="sheet" id="chronSheet" role="dialog" aria-modal="true" aria-label="{{chron_btn}}">
  <div class="sheet-head">
    <div class="tabs" role="tablist">
      <button type="button" class="tab" role="tab" data-tab="history" aria-selected="true">{{tab_history}}</button>
      <button type="button" class="tab" role="tab" data-tab="favs" aria-selected="false">{{tab_favs}}</button>
    </div>
    <button class="x" type="button" aria-label="{{close}}">×</button>
  </div>
  <ul class="list" id="list"></ul>
  <div class="list-tools" id="listTools"></div>
</aside>
<aside class="sheet" id="helpSheet" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
  <div class="sheet-head"><h2 id="helpTitle">{{help_title}}</h2><button class="x" type="button" aria-label="{{close}}">×</button></div>
  <div class="help">
{{@help}}  </div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
// Формат идеи: Название | Описание | Стек | Аномалия (усложнение) | три своих шага через ~
// tail — два завершающих шага области, добавляются после шагов идеи
/*@@LANG@@*//*@@STRINGS@@*/
/*@@CATALOG@@*/

/*@@MIX_SHARED@@*/

/*@@MIX_TEXT@@*/

</script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const u32 = new Uint32Array(1);
const rand = n => { crypto.getRandomValues(u32); return u32[0] % n; };
const pick = arr => arr[rand(arr.length)];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const lcFirst = s => s.replace(/^\p{Lu}(?=\p{Ll})/u, c => c.toLowerCase());   // «Возвраты…» → «возвраты…», но LLM и AR остаются
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (m, k) => k in o ? o[k] : m);
// пробел между иероглифом и латиницей или цифрой там, где их склеила подстановка: «面向B2B 销售» → «面向 B2B 销售»
const gapLatin = s => T.latinGap ? s.replace(/(\p{Script=Han})(?=[A-Za-z0-9])|([A-Za-z0-9])(?=\p{Script=Han})/gu, '$1$2 ') : s;

// ——— База идей ———
// кто есть кто: код идеи каталога («rag.17») или номера «Микса»; у совсем старых карточек — область и название
const keyOf = idea => idea.code || (Array.isArray(idea.mix) ? 'mix.' + idea.mix.join('.') : idea.cat + '::' + idea.title);
const IDEAS = [], STEPS = new Map();   // траектория идеи каталога: три её шага + два завершающих шага области
for (const c of CATEGORIES) {
  c.list = c.ideas.trim().split('\n').map(l => l.trim()).filter(Boolean).map((l, k) => {
    const [title, desc, stack, twist, own = ''] = l.split('|');
    const idea = { title, desc, stack, twist, cat: c.id, code: c.id + '.' + (k + 1) };   // код не зависит от языка
    STEPS.set(keyOf(idea), [...own.split('~').map(x => x.trim()).filter(Boolean), ...c.tail]);
    return idea;
  });
  IDEAS.push(...c.list);
  c.pool = (c.twists || '').trim().split('\n').map(l => l.trim()).filter(Boolean);   // общие аномалии области
}
const CAT = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));
const MIX_CAT = { id:'mix', name:T.mixName, ep:T.mixEp, glyph:'∞' };
const catOf = idea => CAT[idea.cat] || MIX_CAT;
const stepsOf = idea => STEPS.get(keyOf(idea)) || [];

// «Микс»: общая структура и тексты языка собираются в объекты
const DOMAINS = MIX_D.map(([id, tags, ptags], i) => {
  const [name, who, why] = DOMAINS_TX[i];
  return { id, tags: tags.split(' '), name, why, who: who.map((text, k) => {
    // персона: данные, с которыми она работает (any — любые), и dev — ей уместны консольная утилита и API
    const list = ptags[k].split(' '), data = list.filter(x => x !== 'dev' && x !== 'any');
    return { text, data: data.length ? data.join(' ') : 'any', dev: list.includes('dev') };
  }) };
});
const TECHNIQUES = MIX_T.map(([id, stack, needs], i) => { const [name, how, challenge, gives] = TECH_TX[i]; return { id, stack, needs, name, how, challenge, gives }; });
const FORMATS = MIX_F.map(([id, tags, c = {}], i) => { const [name, add, sentence] = FORMATS_TX[i]; return { id, tags, c, name, add, sentence }; });
const MIX_TWISTS = MIX_A.map(([id, tags, c = {}], i) => ({ id, tags, c, text: TWISTS_TX[i] }));

// «Микс» сочетает только совместимое: технике нужны данные, которые в сфере действительно есть
const fits = (t, d) => t.needs === 'any' || t.needs.split(' ').some(tag => d.tags.includes(tag));
const MIX_TECHS = DOMAINS.map(d => TECHNIQUES.filter(t => fits(t, d)));
const ruleOf = t => TECH_RULES[t.id] || {};
// о каких данных идея: потребности техники, совпавшие с тегами сферы; у универсальной техники — основной тег сферы; llm — для языковых моделей
const dataOf = (t, d) => {
  const have = t.needs === 'any' ? [d.tags[0]] : t.needs.split(' ').filter(x => d.tags.includes(x));
  return ruleOf(t).llm ? [...have, 'llm'] : have;
};
const fmtOk = (fi, wi, di) => !FORMATS[fi].c.dev || DOMAINS[di].who[wi].dev;
const twistOk = (ai, fi) => !(MIX_TWISTS[ai].c.notF || []).includes(FORMATS[fi].id);
const suits = (tags, have) => tags === 'any' || tags.split(' ').some(x => have.includes(x));
// что можно сочетать для пары «сфера × техника»: форматы f, аномалии a, персоны w; null — техника здесь неуместна.
// Списки сфер, техник и персон не фильтруются, а только сужают выбор — так номера в старых ссылках остаются верными
const idx = arr => arr.map((x, i) => i);
const MIX_OPTS = DOMAINS.map((d, di) => MIX_TECHS[di].map(t => {
  const r = ruleOf(t), dn = d.id, have = dataOf(t, d), ban = r.ban || [];
  if ((r.onlyIn && !r.onlyIn.includes(dn)) || (r.notIn || []).includes(dn)) return null;
  const a = idx(MIX_TWISTS).filter(i => {
    const { id, tags, c } = MIX_TWISTS[i];
    // универсальной технике — только общие аномалии и аномалии языковых моделей: чужие данные ей не к месту
    return (t.needs !== 'any' || tags === 'any' || tags === 'llm') && suits(tags, have) && !ban.includes(id) &&
      (!c.tech || c.tech.includes(t.id)) && (!c.onlyIn || c.onlyIn.includes(dn)) && !(c.notIn || []).includes(dn);
  });
  const f = idx(FORMATS).filter(i => {
    const { id, tags, c } = FORMATS[i];
    return (!r.only || r.only.includes(id)) && suits(tags, have) && !ban.includes(id) && (!c.domain || d.tags.includes(c.domain)) &&
      (!c.role || c.role === r.role) && a.some(ai => twistOk(ai, i));
  });
  // мета-техники (оценка, синтетика, дистилляция, активное обучение) нужны тем, кто сам строит модели
  const w = idx(d.who).filter(i => suits(d.who[i].data, have) && (r.role !== 'meta' || d.who[i].dev) && f.some(fi => fmtOk(fi, i, di)));
  return w.length ? { f, a, w } : null;
}));
// всего карточек «Микса»: сфера × техника × персона × что даёт × формат × аномалия × формулировка — только совместимые
const MIX_COMBOS = MIX_OPTS.reduce((n, list, di) => n + list.reduce((m, o, ti) => !o ? m : m + MIX_TECHS[di][ti].gives.length *
  o.w.reduce((k, wi) => k + o.f.filter(fi => fmtOk(fi, wi, di)).reduce((x, fi) => x + o.a.filter(ai => twistOk(ai, fi)).length, 0), 0), 0), 0) * MIX_PHRASES.length;
let lastMix = { domain: '', tech: '' };

function buildMix(fresh) {
  // при настоящем броске сфера и техника не повторяют прошлый раз
  let di, ti;
  do di = rand(DOMAINS.length); while (fresh && DOMAINS[di].id === lastMix.domain);
  const techs = MIX_TECHS[di], ok = idx(techs).filter(i => MIX_OPTS[di][i]);
  do ti = pick(ok); while (fresh && ok.length > 1 && techs[ti].id === lastMix.tech);
  if (fresh) lastMix = { domain: DOMAINS[di].id, tech: techs[ti].id };
  const o = MIX_OPTS[di][ti], wi = pick(o.w), fi = pick(o.f.filter(i => fmtOk(i, wi, di)));
  // аномалия: специфичная для данных техники — в двух случаях из трёх, общая — реже
  const as = o.a.filter(i => twistOk(i, fi)), spec = as.filter(i => MIX_TWISTS[i].tags !== 'any');
  return mixFrom(di, ti, wi, rand(techs[ti].gives.length), fi, spec.length && rand(3) ? pick(spec) : pick(as), rand(MIX_PHRASES.length));
}
const mergeStack = (a, b) => [...new Set([...a.split(','), ...b.split(',')].map(x => x.trim()))].join(', ');
// «Микс» по номерам сферы, техники, персоны, фразы «что даёт», формата, аномалии и формулировки — их же хранит ссылка на идею.
// Ссылки старого вида — только первые четыре номера — дают прежнюю карточку без формата и аномалии
function mixFrom(di, ti, wi, pi, fi = -1, ai = -1, vi = 0) {
  const t = MIX_TECHS[di][ti], d = DOMAINS[di], f = FORMATS[fi], a = MIX_TWISTS[ai];
  const benefit = f ? t.gives[pi] : PROBLEMS[pi];   // у старых ссылок — общая фраза «что даёт», у новых — фраза самой техники
  // абзац: почему важно в сфере → как работает → в каком виде → кому пригодится и что даёт → главный вызов
  return {
    title: gapLatin(fmt(T.mixTitle, { tech: cap(t.name), domain: d.name })),
    desc: [d.why, t.how, f ? f.sentence : '', fmt(MIX_PHRASES[vi], { who: d.who[wi].text, pr: benefit, ch: t.challenge })].filter(Boolean).join(T.sentSep),
    stack: f ? mergeStack(t.stack, f.add) : t.stack,
    format: f ? f.name : undefined, twist: a ? a.text : undefined,
    cat: 'mix', mix: f ? [di, ti, wi, pi, fi, ai, vi] : [di, ti, wi, pi]
  };
}
// Короткий код идеи для ссылки и хранения: «rag.17» — область и номер идеи, «rag.17.5» — с пятой общей аномалией области,
// «mix.12.3.4.40…» — номера частей «Микса». Код одинаков на всех языках
const codeOf = idea => {
  if (idea.cat === 'mix') return Array.isArray(idea.mix) ? 'mix.' + idea.mix.join('.') : null;
  return idea.code ? idea.code + (idea.tw ? '.' + idea.tw : '') : null;
};
function ideaFromCode(code) {
  const p = code.split('.'), n = p.slice(1).map(Number);
  if (!n.length || !n.every(Number.isInteger)) return null;
  if (p[0] === 'mix') {
    const [di, ti, wi, pi, fi, ai, vi] = n;
    if (!(DOMAINS[di] && MIX_TECHS[di][ti] && DOMAINS[di].who[wi] && PROBLEMS[pi])) return null;
    if (n.length === 4) return mixFrom(di, ti, wi, pi);
    const o = MIX_OPTS[di][ti];
    return n.length === 7 && o && o.w.includes(wi) && MIX_TECHS[di][ti].gives[pi] && o.f.includes(fi) && fmtOk(fi, wi, di) &&
      o.a.includes(ai) && twistOk(ai, fi) && MIX_PHRASES[vi] ? mixFrom(di, ti, wi, pi, fi, ai, vi) : null;
  }
  const c = Object.prototype.hasOwnProperty.call(CAT, p[0]) ? CAT[p[0]] : null, base = c && c.list[n[0] - 1];
  if (!base || n.length > 2) return null;
  if (n.length === 1) return base;
  return n[1] >= 1 && n[1] <= c.pool.length ? withTwist(base, n[1]) : null;
}

// ——— Хранилище (может быть недоступно на file://) ———
const KEY = 'si_rulet.v1';   // ключ от прежнего названия: при смене имени сохранённые хроника и колода не теряются
const store = {
  load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } },
  save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
};
const saved = store.load();
// Старые сохранения хранили карточки целиком и колоду по «области::названию» — переводим в коды.
// Карточку, которую не узнать (например, после переименования идеи), оставляем как есть, чтобы не потерять избранное
const LEGACY = new Map();
for (const c of CATEGORIES) for (const i of c.list) LEGACY.set(c.id + '::' + i.title, i);
function fromStored(x) {
  if (typeof x === 'string') return ideaFromCode(x);
  if (!x || typeof x !== 'object') return null;
  if (x.cat === 'mix') return (Array.isArray(x.mix) && ideaFromCode('mix.' + x.mix.join('.'))) || x;
  const base = LEGACY.get(x.cat + '::' + x.title);
  return base ? (x.tw ? withTwist(base, x.tw) : base) : x;
}
const seenCode = k => k.includes('::') ? (LEGACY.get(k) || {}).code : k;
const storedList = v => Array.isArray(v) ? v.map(fromStored).filter(Boolean) : [];
// области, которых не было при прошлом сохранении, включаются сами — иначе новые области молча остались бы выключены.
// В сохранениях до появления списка known были первые 32 области каталога
function newCats(sv) {
  const known = Array.isArray(sv.known) ? sv.known : CATEGORIES.slice(0, 32).map(c => c.id);
  return CATEGORIES.map(c => c.id).filter(id => !known.includes(id));
}
const state = {
  mode: saved.mode === 'mix' ? 'mix' : 'curated',
  cats: new Set(Array.isArray(saved.cats) ? [...saved.cats.filter(id => CAT[id]), ...newCats(saved)] : CATEGORIES.map(c => c.id)),
  history: storedList(saved.history),
  favs: storedList(saved.favs),
  seen: new Set(Array.isArray(saved.seen) ? saved.seen.map(seenCode).filter(Boolean) : []),   // уже выпадавшие идеи текущего круга
  lastKey: typeof saved.lastKey === 'string' ? seenCode(saved.lastKey) || '' : '',
  sound: saved.sound === true,
  anim: ['stream', 'decode', 'const', 'deep'].includes(saved.anim) ? saved.anim : 'stream',
  tab: 'history'
};
const persist = () => store.save({
  mode: state.mode, cats: [...state.cats], known: CATEGORIES.map(c => c.id),

let poolCache = null;

// ячейки барабана — просто случайные идеи; результат броска — из колоды без повторов
const fillerItem = () => state.mode === 'mix' ? buildMix() : (pool().length ? pick(pool()) : null);
function drawIdea() {

  let fresh = p.filter(i => !state.seen.has(keyOf(i)));
  if (!fresh.length) {   // круг пройден — начинаем новый, но не с только что выпавшей идеи

// ——— Поток идей: названия летят из глубины к зрителю и проносятся мимо; выпавшая встаёт в центр ———
const drumEl = $('#drum'), flareEl = $('#flare'), beaconEl = $('#beacon'), stageEl = $('.stage');
const streamEl = document.createElement('div');
streamEl.className = 'anim stream';
drumEl.appendChild(streamEl);
const POOL = 10, AHEAD = 7, BEHIND = 2;   // видно от двух пролетевших до семи впереди
const items = [];
for (let k = 0; k < POOL; k++) {
  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML = '<span class="c-cat"></span><span class="c-title"></span>';
  el._i = null;
  streamEl.appendChild(el);
  items.push(el);
}
const reel = new Map();
const itemAt = i => { if (!reel.has(i)) reel.set(i, fillerItem()); return reel.get(i); };
let offset = 0, spinning = false, chosenIndex = null;
let waiting = true;   // до первого броска в центре маяк, а не случайная идея

function fill(el, item) {
  const c = item ? catOf(item) : null;
  el.firstChild.textContent = c ? c.glyph + '  ' + c.name : '';
  el.lastChild.textContent = item ? item.title : '';
}
// у каждой идеи свой луч от точки схода: в основном вбок — мимо заголовка и кнопки
function passDir(i) {
  const h = Math.sin(i * 12.9898) * 43758.5453, f = h - Math.floor(h);
  const an = (f - .5) * 1.1 + (i % 2 ? Math.PI : 0);
  return [Math.cos(an), Math.sin(an) * .6];
}
function layout() {
  const base = Math.floor(offset), focusI = Math.round(offset);
  streamEl.classList.toggle('idle', !spinning);
  for (let k = 0; k < POOL; k++) {
    const i = base - BEHIND + k, el = items[k], d = i - offset;
    // пустые позиции и ожидание первого броска — ничего не показываем
    if (d > AHEAD || d < -1.4 || (waiting && !spinning) || !itemAt(i)) { el.style.visibility = 'hidden'; continue; }
    el.style.visibility = '';
    if (el._i !== i) { el._i = i; fill(el, itemAt(i)); }
    const [dx, dy] = passDir(i);
    let x, y, sc, op;
    if (d >= 0) {   // впереди: маленькая и приглушённая на своём луче, к центру сходится только вблизи
      const r = Math.min(d, 3) * 72;
      sc = 1 / (1 + d * .9);
      x = dx * r; y = dy * r;
      op = d < .35 ? 1 : (1 - smooth(.35, AHEAD, d)) * .45;

      const p = -d, r = p * 380 + p * p * 200;

    el.style.opacity = Math.max(0, op).toFixed(3);
    el.classList.toggle('soft', d > 2.2 || d < -.25);
    el.style.zIndex = String(100 - Math.round(d * 10));   // ближние поверх дальних

}
// новые фильтры: поток собирается заново, но идея в центре — та, что в карточке, — остаётся

// Профиль скорости: быстрый разгон (~10%) и длинное торможение
const CURVE = (() => {
  const N = 300, P = new Float64Array(N + 1);
  let s = 0;
  for (let n = 1; n <= N; n++) {
    const t = (n - 0.5) / N, r = Math.min(1, t / 0.1);
    s += r * r * (3 - 2 * r) * Math.pow(1 - t, 2.4);
    P[n] = s;
  }
  for (let n = 0; n <= N; n++) P[n] /= s;
  return P;
})();
const curve = t => {

};
const slope = t => (curve(Math.min(1, t + .01)) - curve(t)) / .01;   // скорость в момент t

  return out;
}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

// ——— Звук: по умолчанию выключен; «звёздная капля», когда ячейка проходит линию выбора ———
const soundBtn = $('#soundBtn');
let actx = null, dry = null, space = null, noiseBuf = null, lastTick = -1;
function audio() {
  if (!state.sound) return null;
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
    const master = actx.createGain();
    master.gain.value = 0.7;
    master.connect(actx.createDynamicsCompressor()).connect(actx.destination);
    // сухой путь: всё выше 2,4 кГц срезается — телефонные динамики выпячивают верха
    dry = actx.createBiquadFilter();
    dry.type = 'lowpass'; dry.frequency.value = 2400; dry.Q.value = 0.7;
    dry.connect(master);
    // «пространство»: короткое затухающее эхо, темнее сухого звука
    space = actx.createDelay(1);
    space.delayTime.value = 0.13;
    const fb = actx.createGain(), tone = actx.createBiquadFilter();
    fb.gain.value = 0.32; tone.type = 'lowpass'; tone.frequency.value = 1600;
    space.connect(tone).connect(fb).connect(space);
    tone.connect(master);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);   // шум для эфира, ветра и треска
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}

// Созвездие: у каждой звезды своя нота — чем выше звезда, тем выше нота; в конце аккорд

// ——— Анимации поиска. Общий набор действий у всех: run — бросок, show — показать готовую идею,
//     mount — собрать сцену под текущий размер, refill — пересобрать поток после смены фильтров ———
const catLine = idea => { const c = catOf(idea); return c.glyph + '  ' + c.name; };
// «Поток идей» — названия летят из глубины навстречу
const stream = {
  el: streamEl, flare: true,
  run(idea, dur, quick, first, done) {
    const start = offset, base = Math.round(start);
    const target = base + (quick ? 6 : 44 + rand(15));
    for (const k of [...reel.keys()]) if (k > base + AHEAD + 1 || k < base - BEHIND - 2) reel.delete(k);
    if (first) reel.set(base, null);   // первый бросок: в центре пусто — первая идея прилетит из глубины
    reel.set(target, idea);

    const frame = now => {

      const p = quick ? 1 - Math.pow(1 - t, 3) : curve(t);

// «Расшифровка сигнала» — названия сменяются всё реже сквозь помехи, последнее проясняется
const NOISE = T.noise;

const decode = {
  flare: true,
  mount() {

    this.el.append(this.cat, this.ttl);
    drumEl.appendChild(this.el);
  },
  run(idea, ms, quick, first, done) {
    this.mount();

    const switches = moments(quick ? 4 : 26, run), t0 = performance.now();
    let si = 0, shown = fillerItem() || idea, share = .5, lastNoise = 0, mask = [], cleared = 0, total = 0;
    el.classList.remove('done');
    decodeSound.start();
    const frame = now => {
      const e = Math.max(0, (now - t0) / 1000);

          si++;

          share = .55 * (1 - si / switches.length) + .2;   // чем медленнее смены, тем меньше помех
          decodeSound.static();

        } else {   // пришла нужная идея: запоминаем, какие буквы ещё искажены
          mask = [...idea.title].map(ch => ch !== ' ' && Math.random() < share);
          total = mask.filter(Boolean).length;

          if (!left.length) break;
          mask[left[Math.floor(Math.random() * left.length)]] = false;
          cleared++;

// «Созвездие» — огонёк прыгает между звёздами-идеями, как шарик рулетки, и замирает на одной

  flare: false,

      const p = { x: W * (.16 + Math.random() * .68), y: H * (.17 + Math.random() * .38) };

// «Полёт к звезде» — камера летит вглубь созвездия от звезды к звезде и тормозит у выбранной
const glowSprite = (() => {

      y = Math.max(-1.3, Math.min(1.3, y + (Math.random() - .5) * 1.2));

    }
    st.forEach(p => { p.note = SCALE[Math.round((1 - (p.y + 1.3) / 2.6) * (SCALE.length - 1))]; });   // выше — выше нота
    this.links = [];

// ——— Глубокий космос ———
// Дальний план (звёзды, Млечный Путь, галактики) почти неподвижен и рисуется один раз.
// Средний план — слои туманности: летят из точки за барабаном, проходят сквозь экран и появляются вновь.
const skyWrap = $('#skyWrap'), skyEl = $('#sky'), sctx = skyEl.getContext('2d'), nebWrap = $('#neb');

// Перлин-шум с детерминированным генератором (mulberry32)

  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  for (let i = 0; i < 256; i++) { const a = rnd() * Math.PI * 2; gx[i] = Math.cos(a); gy[i] = Math.sin(a); }

// Дальний план: свечение Млечного Пути, пылевые прожилки и слабая дымка по всему небу
async function makeFar(N, nw, nh, aspect, bandAt, gen) {
  const c = document.createElement('canvas');
  c.width = nw; c.height = nh;
  const cc = c.getContext('2d'), img = cc.createImageData(nw, nh), px = img.data, sc = 2.1;
  for (let j = 0; j < nh; j++) {
    const y = j / nh;
    for (let i = 0; i < nw; i++) {
      const x = i / nw * aspect, nx = x * sc, ny = y * sc;
      const band = bandAt(x, y), haze = N.fbm(nx + 3.3, ny + 1.1, 5);
      const dust = smooth(0, 0.4, N.fbm(nx * 2.1 + 13.1, ny * 2.1 + 3.7, 4)) * (0.3 + 0.7 * band);
      const dens = (band * (0.45 + 0.55 * smooth(-0.3, 0.4, haze)) * 0.7 + smooth(0, 0.6, haze) * 0.22) * (1 - 0.85 * dust);
      const t = smooth(-0.4, 0.4, haze), core = band * band * band * 0.6;

      const lum = 0.55 + 0.9 * dens, o = (j * nw + i) * 4, dz = Math.random() * 3 - 1.5;   // dz — дизеринг против полос
      px[o] = R * lum + dz; px[o + 1] = G * lum + dz; px[o + 2] = B * lum + dz;
      px[o + 3] = Math.min(1, dens) * 150 + Math.random() * 2;
    }

  }

}

// Облако туманности: fBm с искажением координат, края растворяются — у слоя нет видимых границ
async function makeCloud(seed, nw, nh, aspect, pal, gen) {
  const N = makeNoise(seed), [A, B, Hc] = pal;
  const c = document.createElement('canvas');
  c.width = nw; c.height = nh;
  const cc = c.getContext('2d'), img = cc.createImageData(nw, nh), px = img.data, sc = 2.1;
  for (let j = 0; j < nh; j++) {
    const y = j / nh, ey = (y - .5) * 2;
    for (let i = 0; i < nw; i++) {
      const x = i / nw * aspect, nx = x * sc, ny = y * sc, ex = (i / nw - .5) * 2;
      const qx = N.fbm(nx + 1.7, ny + 9.2, 4), qy = N.fbm(nx + 8.3, ny + 2.8, 4);
      const r = N.fbm(nx + 2.6 * qx + 4.1, ny + 2.6 * qy + 7.3, 5);
      const dust = smooth(0.05, 0.45, N.fbm(nx * 2.1 + 13.1, ny * 2.1 + 3.7, 4));
      const edge = 1 - smooth(0.55, 1, Math.hypot(ex, ey));

      const lum = 0.6 + 0.8 * dens, o = (j * nw + i) * 4, dz = Math.random() * 3 - 1.5;
      px[o] = R * lum + dz; px[o + 1] = G * lum + dz; px[o + 2] = Bc * lum + dz;
      px[o + 3] = dens * 140;
    }
    if (j % 24 === 23) { await yieldFrame(); if (gen !== skyGen) return null; }
  }
  cc.putImageData(img, 0, 0);

}

async function buildSky() {
  const gen = ++skyGen;   // новая генерация отменяет незаконченную старую
  const SW = W * OVER, SH = H * OVER, aspect = SW / SH;
  const N = makeNoise(SKY_SEED);

  // Млечный Путь — диагональная полоса через экран
  const ang = (N.rnd() < .5 ? -1 : 1) * (0.35 + N.rnd() * 0.35);
  const bx = aspect / 2 + (N.rnd() - .5) * .3, by = .5 + (N.rnd() - .5) * .3;
  const bw = .2 + N.rnd() * .1, sa = Math.sin(ang), ca = Math.cos(ang);
  const bandAt = (x, y) => { const d = (x - bx) * sa - (y - by) * ca; return Math.exp(-(d * d) / (bw * bw)); };

  // Звёзды спектральных классов: от голубых до оранжевых
  const PAL = ['170,196,255', '200,216,255', '236,240,255', '255,246,232', '255,226,186', '255,196,160'];
  const PW = [.16, .2, .3, .17, .11, .06];

  for (let n = Math.round(area / 1400); n--;)
    stars.push({ u: N.rnd(), v: N.rnd(), r: 0.3 + Math.pow(N.rnd(), 3) * 1.1, a: 0.25 + N.rnd() * 0.7, c: pickCol() });
  for (let n = Math.round(area / 500), tries = n * 6; n > 0 && tries--;) {   // звёздная пыль в полосе
    const u = N.rnd(), v = N.rnd();
    if (N.rnd() > Math.pow(bandAt(u * aspect, v), 1.6)) continue;
    stars.push({ u, v, r: 0.25 + N.rnd() * 0.35, a: 0.12 + N.rnd() * 0.4, c: pickCol() });
    n--;
  }
  for (let n = 9 + Math.floor(N.rnd() * 6); n--;)
    bright.push({ u: N.rnd(), v: N.rnd(), r: 0.9 + N.rnd() * 0.9, g: 5 + N.rnd() * 9, c: pickCol(), spike: N.rnd() < .45 });

    galaxies.push({ u: .08 + N.rnd() * .84, v: .08 + N.rnd() * .84, s: 9 + N.rnd() * 14, e: .3 + N.rnd() * .4, rot: N.rnd() * Math.PI });

  // Дальний план считается в низком разрешении частями, затем растягивается
  const k = Math.min(1, Math.sqrt(160000 / area)), nw = Math.max(64, Math.round(SW * k)), nh = Math.max(64, Math.round(SH * k));

  sky = { far, stars, bright, galaxies };
  skyAspect = W / H;
  drawSky();
  skyWrap.classList.add('ready');

  // Текстуры туманности: первая — сразу, остальные дозревают в фоне и подмешиваются при новых пролётах
  const lw = W * 1.6, lh = H * 1.6, kt = Math.min(1, Math.sqrt(450000 / (lw * lh)));
  const tw = Math.max(64, Math.round(lw * kt)), th = Math.max(64, Math.round(lh * kt)), texs = [];
  for (let t = 0; t < NEB_PAL.length; t++) {
    const tex = await makeCloud(SKY_SEED + 7919 * (t + 1), tw, th, lw / lh, NEB_PAL[t], gen);
    if (!tex) return;
    texs.push(tex);

// ——— Слои туманности ———
// Все слои рисуются в один холст низкого разрешения: туманность мягкая, а кадр остаётся дешёвым
const nebCv = document.createElement('canvas'), nebCtx = nebCv.getContext('2d');
nebWrap.appendChild(nebCv);
let NQ = 1;   // разрешение холста туманности относительно экрана
function initLayers() {
  layers = [];
  for (const phase of [0.12, 0.45, 0.78]) { const L = { phase }; respawn(L); layers.push(L); }
}
function sizeLayers() {
  LW = W * 1.6; LH = H * 1.6;
  NQ = Math.min(1, Math.sqrt(400000 / (W * H)));
  nebCv.width = Math.max(1, Math.round(W * NQ)); nebCv.height = Math.max(1, Math.round(H * NQ));
}
// Слой ушёл за спину — возвращается вдаль с другой текстурой, поворотом и смещением
function respawn(L) {

  const all = nebTex.map((_, i) => i), free = all.filter(i => !used.has(i)), pool = free.length ? free : all;
  L.tex = pool[Math.floor(Math.random() * pool.length)];
  L.rot = Math.random() * Math.PI * 2;
  L.spin = (Math.random() - .5) * 0.012;
  L.flip = Math.random() < .5 ? -1 : 1;
  L.ox = (Math.random() - .5) * 0.5; L.oy = (Math.random() - .5) * 0.4;   // смещение от точки схода, доли экрана
}
function flyNebula(dt, cx, cy, still) {
  if (!layers.length) return;
  const speed = still ? 0 : (1 + warp * 14) / FLY_T * calm;   // при запуске — прыжок сквозь облака
  const c = nebCtx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, nebCv.width, nebCv.height);
  for (const L of layers) {
    L.phase += dt * speed;
    if (L.phase >= 1) { L.phase -= 1; respawn(L); }
    if (!still) L.rot += dt * L.spin;
    // масштаб растёт экспоненциально — приближение с постоянной скоростью
    const sc = 0.4 * Math.pow(7.5, L.phase);
    const op = smooth(0, 0.3, L.phase) * (1 - smooth(0.65, 1, L.phase));
    if (op < 0.003) continue;
    c.globalAlpha = op;
    c.setTransform(NQ, 0, 0, NQ, 0, 0);
    c.translate(cx + L.ox * W * sc, cy + L.oy * H * sc);
    c.rotate(L.rot);
    c.scale(sc * L.flip, sc);
    c.drawImage(nebTex[L.tex], -LW / 2, -LH / 2, LW, LH);
  }

}

function drawSky() {
  if (!sky) return;
  const dpr = Math.min(1.5, window.devicePixelRatio || 1), SW = W * OVER, SH = H * OVER, TAU = Math.PI * 2;
  skyEl.width = Math.round(SW * dpr); skyEl.height = Math.round(SH * dpr);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.imageSmoothingEnabled = true; sctx.imageSmoothingQuality = 'high';
  sctx.drawImage(sky.far, 0, 0, SW, SH);

    sctx.fillStyle = `rgba(${st.c},${st.a.toFixed(3)})`;
    sctx.beginPath(); sctx.arc(st.u * SW, st.v * SH, st.r, 0, TAU); sctx.fill();
  }
  for (const g of sky.galaxies) {   // далёкие галактики — размытые эллипсы с ярким ядром
    sctx.save();
    sctx.translate(g.u * SW, g.v * SH); sctx.rotate(g.rot); sctx.scale(1, g.e);
    const gr = sctx.createRadialGradient(0, 0, 0, 0, 0, g.s);
    gr.addColorStop(0, 'rgba(255,240,225,.55)'); gr.addColorStop(.18, 'rgba(220,200,255,.22)'); gr.addColorStop(1, 'rgba(160,150,255,0)');

    const x = b.u * SW, y = b.v * SH;
    const gr = sctx.createRadialGradient(x, y, 0, x, y, b.g);
    gr.addColorStop(0, `rgba(${b.c},.9)`); gr.addColorStop(.12, `rgba(${b.c},.35)`); gr.addColorStop(1, `rgba(${b.c},0)`);
    sctx.fillStyle = gr; sctx.beginPath(); sctx.arc(x, y, b.g, 0, TAU); sctx.fill();
    if (b.spike) {

}

    const n = document.createElement('canvas');
    n.width = n.height = Math.ceil(m.width / 2);
    const ng = n.getContext('2d');

    ng.drawImage(m, 0, 0, n.width, n.height);

  }

  ctx.textAlign = 'center';
  ctx.fillStyle = `rgba(170,196,255,${(.5 * op).toFixed(3)})`;
  ctx.fillText(c.name.toUpperCase(), P.reduce((t, p) => t + p[0], 0) / P.length, Math.max(...P.map(p => p[1])) + 18 + grow * 4);
  ctx.textAlign = 'start';
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
}

function drawStar(p, cx, cy, v) {
  const near = 1 - p.z, sx = p.sx, sy = p.sy;
  const alpha = (Math.min(1, near * 1.4) * p.a).toFixed(3);
  if (warp > 0.04) {
    // хвост луча — к центру, длина ограничена; к хвосту цвет уходит в фиолетовый
    const pz = Math.min(1, p.z + v * 6);
    let tx = cx + p.x / pz * F - sx, ty = cy + p.y / pz * F - sy;
    const len = Math.hypot(tx, ty), max = 30 + 150 * warp;
    if (len > max) { tx *= max / len; ty *= max / len; }
    const g = ctx.createLinearGradient(sx + tx, sy + ty, sx, sy);
    g.addColorStop(0, 'rgba(150,120,255,0)'); g.addColorStop(1, `rgba(${p.c},${alpha})`);
    ctx.strokeStyle = g;
    ctx.lineWidth = 0.4 + near * 1.2;
    ctx.beginPath();
    ctx.moveTo(sx + tx, sy + ty);
    ctx.lineTo(sx, sy);
    ctx.stroke();
  } else {
    ctx.fillStyle = `rgba(${p.c},${alpha})`;
    ctx.beginPath();
    ctx.arc(sx, sy, 0.3 + near * 1.3, 0, 6.2832);
    ctx.fill();
  }
}

let lastNow = 0;
function tick(now) {
  const dt = Math.min(0.1, Math.max(0, (now - lastNow) / 1000));   // после скрытой вкладки — без рывка
  lastNow = now;
  if (!document.hidden && W) {
    ctx.clearRect(0, 0, W, H);
    const cx = VX, cy = VY;   // звёзды, туманность и планеты летят из точки схода
    const still = reduceMotion.matches;
    warp += ((spinning && !still ? 1 : 0) - warp) * (spinning ? 0.05 : 0.03);
    const calmTo = reading ? 0.55 : 1;
    calm += (calmTo - calm) * (calmTo > calm ? 0.1 : 0.025);
    const v = still ? 0 : (0.0007 + warp * 0.022) * calm;
    flyNebula(dt, cx, cy, still);
    if (warp > 0.01) {   // свет в точке схода во время прыжка
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.5);
      g.addColorStop(0, `rgba(176,160,255,${(warp * 0.2).toFixed(3)})`);
      g.addColorStop(1, 'rgba(176,160,255,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    ctx.lineCap = 'round';
    // планета и светило — от дальнего к ближнему; частицы-звёзды встают между ними по глубине
    updatePlanet(dt, now, cx, cy, still);
    updateSun(dt, now, cx, cy, still);
    const bodies = [];
    if (planet) bodies.push({ z: planet.z, draw: () => drawPlanet(cx, cy) });
    if (sun) bodies.push({ z: sun.z, draw: () => drawSun(cx, cy, now) });
    bodies.sort((a, b) => b.z - a.z);
    const layers = bodies.map(() => []);   // layers[i] — частицы ближе тела i, но дальше следующего
    for (const p of stars) {
      p.z -= v;
      if (p.z <= 0.02) spawn(p, false);
      p.sx = cx + p.x / p.z * F; p.sy = cy + p.y / p.z * F;
      if (p.sx < -50 || p.sx > W + 50 || p.sy < -50 || p.sy > H + 50) { spawn(p, false); continue; }
      let li = -1;
      for (let i = 0; i < bodies.length; i++) if (p.z < bodies[i].z) li = i;
      if (li < 0) drawStar(p, cx, cy, v); else layers[li].push(p);
    }
    bodies.forEach((body, i) => { body.draw(); for (const p of layers[i]) drawStar(p, cx, cy, v); });
    drawMeteor(now, still);
  }
  requestAnimationFrame(tick);
}

// ——— Управление ———
spinBtn.onclick = spin;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && openSheet) { closeSheets(); return; }
  if (e.code !== 'Space' && e.key !== 'Enter') return;
  if (openSheet) return;   // в открытой панели пробел и Enter — для её кнопок
  if (e.target.closest && e.target.closest('button, summary, input, textarea, a, select')) return;
  e.preventDefault();
  spin();
});
addEventListener('resize', resize);

// ——— Старт ———
// из файла на диске папка сама не открывает index.html — ссылки выбора языка ведут прямо на него
if (location.protocol === 'file:') for (const a of document.querySelectorAll('.langs a')) a.href = a.href.replace(/\/$/, '/index.html');
updateFooter();
syncSound();
syncControls();
updateSpinState();
resize();
buildSky();
renderList();
openShared();
addEventListener('hashchange', openShared);
requestAnimationFrame(tick);
})();
</script>
</body>
